# windows-latest and macos-latest are required from task 00 onward (CLAUDE.md,
# cross-platform rules): development happens on either, and breakage on the platform
# you are not sitting at is invisible. Do not drop either row.
# The python matrix spans the declared requires-python range, ">=3.11,<3.14"; 3.12 is
# the reference interpreter.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy

      - name: pytest
        run: python -m pytest -q

      - name: task files match IMPLEMENTATION.md
        # tasks/ is generated; a hand edit to it is a bug (CLAUDE.md).
        if: runner.os == 'Linux'
        run: |
          python split_tasks.py
          git diff --exit-code -- tasks/
